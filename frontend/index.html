<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
    <title>Explainable AI Data Cleaning</title>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <video class="bg-video" autoplay muted loop playsinline>
        <source
          src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260809_012548_ef22562c-c0ae-4816-ad9d-f8922af4e6a7.mp4"
          type="video/mp4"
        />
      </video>
      <div class="bg-dots"></div>
      <div class="bg-bits" id="bg-bits"></div>
      <div class="bg-overlay"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Mirrors ADQI's own background-video treatment: a touch faster than
      // real time for a livelier feel, and fully respects reduced-motion by
      // not forcing playback on people who've asked for less motion.
      (function () {
        var prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var video = document.querySelector(".bg-video");
        if (!video) return;
        if (prefersReducedMotion) {
          video.pause();
          video.removeAttribute("autoplay");
          return;
        }
        var applyRate = function () { video.playbackRate = 1.35; };
        applyRate();
        video.addEventListener("loadedmetadata", applyRate);
      })();

      // A field of stray white 0/1s scattered across the whole page (not
      // just the hero banner), twinkling alongside the background video —
      // generated once at load since it's decorative, not app state.
      (function () {
        var container = document.getElementById("bg-bits");
        if (!container) return;
        var frag = document.createDocumentFragment();
        var count = 80;
        for (var i = 0; i < count; i++) {
          var span = document.createElement("span");
          span.textContent = Math.random() > 0.5 ? "1" : "0";
          span.style.top = (Math.random() * 100).toFixed(2) + "%";
          span.style.left = (Math.random() * 100).toFixed(2) + "%";
          span.style.fontSize = (10 + Math.random() * 9).toFixed(1) + "px";
          span.style.setProperty("--bo", (0.08 + Math.random() * 0.18).toFixed(2));
          span.style.setProperty("--bdur", (3 + Math.random() * 4).toFixed(1) + "s");
          span.style.setProperty("--bdelay", (Math.random() * 3).toFixed(1) + "s");
          frag.appendChild(span);
        }
        container.appendChild(frag);
      })();
    </script>
  </body>
</html>
