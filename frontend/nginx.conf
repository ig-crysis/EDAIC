server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Vite content-hashes these filenames, so a changed file always gets a
    # new URL — safe to cache aggressively and never worry about staleness.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
